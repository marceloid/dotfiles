onboarding = false
# herdr configuration (~/.config/herdr/config.toml)

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#090809"
active_row_bg = "#0c0b0c"
selection_bg = "#584e51"
panel_bg = "reset"
accent = "#b59790"
red = "#c38b7b"
green = "#87a9b0"
yellow = "#6B5E73"
blue = "#b59790"
text = "#FAFCFB"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
# Prefixo no estilo tmux (Ctrl+a ou Ctrl+b)
prefix = "ctrl+a"

# Atalhos com prefixo (Ctrl+a seguido da tecla)
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Abas / Janelas (Tabs)
new_tab = "prefix+c"
rename_tab = "prefix+,"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Painéis (Panes) - Navegação direta estilo Vim (sem precisar de prefixo)
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Divisão de painéis (Splits) - Idêntico ao padrão do Tmux
split_vertical = "prefix+%"
split_horizontal = "prefix+\""
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

# herdr-annotate (plugin "annotate", variante full)
# Anota texto do terminal e devolve como contexto ao agente. O plugin nao traz
# tecla padrao: sem este bloco as acoes ficam inacessiveis pelo teclado.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Revisao de documento e resposta do agente (plannotator-tui) -- so na variante full
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"

[ui]
mouse_capture = true
copy_on_select = true
pane_borders = true
pane_gaps = true
tab_bar_position = "top"

agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "system"
